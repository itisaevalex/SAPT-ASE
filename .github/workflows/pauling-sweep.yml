# .github/workflows/pauling-sweep.yml
name: SAPTASE Pauling-point sweep

on:
  workflow_dispatch:            # run manually from the GitHub UI
    inputs:
      basis_list:               # override default 12 bases if needed
        description: "Comma-separated basis names (leave empty for default)"
        required: false
        default: ''
      dimer_zip_url:
        description: "URL to ZIP of .xyz files (optional, defaults to using ./s22_xyz/)"
        required: false
        default: ''

jobs:
  sweep:
    # Use a larger runner label (e.g., ubuntu-latest-8-cores, ubuntu-latest-16-cores)
    # Check available labels in your GitHub organization/enterprise settings
    # Using ubuntu-latest for now, adjust as needed for available large runners.
    runs-on: ubuntu-latest # <-- ADJUST THIS to your available large runner label if needed
    timeout-minutes: 180            # hard stop to protect budget
    env:
      # Runner-local scratch path is now defined at the step level
      # SAPTASE_SCRATCH_ROOT: "${{ runner.temp }}/saptase_scratch"
      # Keep other env vars from the detailed example if needed
      PYTHONUNBUFFERED: "1"
      DB_FILE: runs/pauling.sqlite  # Assuming you want the checkpoint DB
      WAL_BUSY: "10000"

    steps:

    # 1 Checkout your repo
    - uses: actions/checkout@v4

    # 2 Set up Python environment using the existing CI environment file
    - name: Set up micromamba + env
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: environment-ci.yml   # Use the existing conda env file
        init-shell: bash        # Ensure bash is initialized

    # 3 Prepare sweep input (ensure split data directory exists)
    # This assumes data/s22_split is checked into the repo
    - name: Verify split data directory
      shell: bash
      run: |
        if [ -d "data/s22_split" ]; then
          echo "Found data/s22_split directory."
          ls data/s22_split
        else
          echo "Error: data/s22_split directory not found! Commit this directory to the repo."
          exit 1
        fi

    # 4 Generate YAML job file using the provided script
    - name: Build job file
      shell: bash -l {0} # Use login shell for conda env
      run: |
        echo "Building sweep YAML..."
        # Ensure script is executable if needed: chmod +x scripts/build_sweep_yaml.py
        python scripts/build_sweep_yaml.py \
          --split-xyz-dir data/s22_split \
          --basis-list "${{ github.event.inputs.basis_list || '' }}" \
          --out sweep.yml
        echo "Sweep YAML created:"
        cat sweep.yml

    # 5 Prepare scratch root
    - name: Prepare scratch root
      env:
        SAPTASE_SCRATCH_ROOT: "${{ runner.temp }}/saptase_scratch"
      shell: bash
      run: |
        echo "Ensuring scratch root directory exists: ${{ env.SAPTASE_SCRATCH_ROOT }}"
        mkdir -p "${{ env.SAPTASE_SCRATCH_ROOT }}"

    # 6 Run the sweep using local_parallel mode
    - name: Execute sweep via SAPTASE
      env:
        SAPTASE_SCRATCH_ROOT: "${{ runner.temp }}/saptase_scratch"
      shell: bash -l {0} # Use login shell for conda env
      run: |
        echo "Running SAPTASE sweep..."
        # Invoke via python -m for robustness in CI environment
        python -m saptase.cli run sweep.yml \
            --mode local_parallel \
            -w 1 # Reduced workers to 1 to diagnose resource issues
        # Scratch root is handled by SAPTASE_SCRATCH_ROOT env var

    # 7 Compress results (scratch + runs dir)
    # Be mindful of artifact size limits (check GitHub docs)
    - name: Tar results
      env:
        SAPTASE_SCRATCH_ROOT: "${{ runner.temp }}/saptase_scratch"
      if: always() # Run even if previous steps fail to capture logs/db
      shell: bash
      run: |
        echo "Compressing results..."
        # Create archive, continue on error (-k), show progress/verbose (-v)
        tar -czvf outputs.tar.gz runs/ ${{ env.SAPTASE_SCRATCH_ROOT }} || echo "Tar failed, continuing..."


    # 8 Upload provenance DB & compressed outputs
    - name: Persist artifacts
      if: always() # Run even if previous steps fail
      uses: actions/upload-artifact@v4
      with:
        name: saptase-pauling-results-${{ github.run_id }}
        path: |
          outputs.tar.gz
          runs/*.sqlite
          sweep.yml
        retention-days: 14
        if-no-files-found: warn # Don't fail workflow if files missing 

  run_mock_tests: # New job for running mock tests
    runs-on: ubuntu-latest
    name: Run Mock and CLI Smoke Tests
    env:
      SAPTASE_SCRATCH_ROOT: "${{ runner.temp }}/saptase_mock_test_scratch"
      PYTHONUNBUFFERED: "1"
      CI_FAST: "1" # From CI logs, might be relevant for test configuration
      OMP_NUM_THREADS: 1 # From CI logs for Dask smoke test
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba + env for mock tests
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment-ci.yml # Specifies saptase-ci env
          init-shell: bash # Initialize micromamba for bash shells

      - name: Pytest (excluding slow and psi4-dependent tests)
        shell: bash -l {0} # Use a login shell, which respects micromamba init
        run: |
          echo "Ensuring saptase-ci environment is active for pytest..."
          micromamba activate saptase-ci # Explicit activation for robustness
          echo "Running pytest..."
          pytest -v -m "not slow and not psi4"

      - name: CLI Dask Smoke Test
        shell: bash -l {0} # Use a login shell
        run: |
          set -e # Exit on error
          # This variable can be controlled by inputs or matrix strategy in a real scenario
          # For this example, we'll simulate the "mock" path that was failing.
          TEST_TYPE="mock" 

          echo "Ensuring saptase-ci environment is active for Dask smoke test (mode: $TEST_TYPE)..."
          micromamba activate saptase-ci # Explicitly activate saptase-ci for all paths

          if [[ "$TEST_TYPE" == "real" ]]; then
            echo "Running Dask smoke test in saptase-ci environment (real mode)..."
            python -m saptase.cli run examples/dask_local_demo.yml --mode dask
          else
            echo "Running Dask smoke test in saptase-ci environment (mock mode)..."
            # This branch previously failed due to running in the default env
            # Now it will correctly use the activated saptase-ci environment
            python -m saptase.cli run examples/dask_local_demo.yml --mode dask
          fi