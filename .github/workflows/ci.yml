name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

env: # Workflow level environment variables
  RUN_STRESS: 'false' # Default to false; can be overridden (e.g., by secrets/dispatch)

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install black ruff
    - name: Check formatting with black
      run: |
        black --check .
    - name: Lint with ruff
      run: |
        ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Don't cancel all jobs if one fails
      matrix:
        python-version: ['3.10', '3.11']
        os: [ubuntu-latest, windows-latest]
        psi4-mode: ["mock", "real"]
        # Exclude Windows + Real Psi4 for now (no windows binary)
        exclude:
          - os: windows-latest
            psi4-mode: real

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set scratch root
      run: |
        mkdir -p "$RUNNER_TEMP/saptase"
        echo "SAPTASE_SCRATCH_ROOT=$RUNNER_TEMP/saptase" >> "$GITHUB_ENV"

    # ----------------------------------------------------------------------
    # Setup for MOCK Psi4 mode (pip install)
    # ----------------------------------------------------------------------
    - name: Set up Python (Mock Mode)
      if: matrix.psi4-mode == 'mock'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies (Mock Mode)
      if: matrix.psi4-mode == 'mock'
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest numpy tqdm dask[distributed]
        # No Psi4 needed here

    - name: Install saptase in editable mode (Mock Mode)
      if: matrix.psi4-mode == 'mock'
      run: |
        python -m pip install --editable .

    - name: Test with pytest (Mock Mode)
      if: matrix.psi4-mode == 'mock'
      env:
        CI_FAST: 1 # Ensure tests use mocks
      run: |
        pytest -v -m "not slow and not psi4"

    # ----------------------------------------------------------------------
    # Setup for REAL Psi4 mode (micromamba install)
    # ----------------------------------------------------------------------
    - name: List files for debugging
      if: matrix.psi4-mode == 'real'
      run: ls -la

    - name: Install Psi4 w/ micromamba (Real Mode)
      if: matrix.psi4-mode == 'real'
      uses: mamba-org/setup-micromamba@v1
      with:
        cache-downloads: true          # speed subsequent runs
        environment-file: environment-ci.yml   # Use the new conda env file from repo root

    - name: Install saptase in editable mode (Real Mode)
      if: matrix.psi4-mode == 'real'
      shell: bash -l {0} # Micromamba requires login shell
      run: |
        python -m pip install --editable .

    - name: Test with pytest (Real Mode)
      if: matrix.psi4-mode == 'real'
      shell: bash -l {0} # Micromamba requires login shell
      env:
        OMP_NUM_THREADS: 1 # Limit threads for Psi4
        # CI_FAST is NOT set here, so tests run real calculations
      run: |
        pytest -v -m "slow and psi4"

    # ----------------------------------------------------------------------
    # CLI Smoke Test (Run for both modes, but uses CI_FAST for mock)
    # ----------------------------------------------------------------------
    - name: Run CLI Dask smoke test
      if: ${{ !cancelled() }} # Only run if previous steps succeeded
      # Continue on Windows due to potential dask port flakes (only affects mock mode now)
      continue-on-error: ${{ matrix.os == 'windows-latest' && matrix.psi4-mode == 'mock' }}
      # Default shell should work for finding the installed saptase command
      env:
        OMP_NUM_THREADS: 1
        # Conditionally set CI_FAST based on matrix
        CI_FAST: ${{ matrix.psi4-mode == 'mock' && 1 || 0 }}
      run: |
        python -m saptase.cli run examples/dask_local_demo.yml --mode dask

  # Optional job that tests with Psi4 (REMOVED - Covered by matrix)

  stress:
    if: ${{ vars.RUN_STRESS == 'true' }} # Use vars for workflow-level variables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy tqdm dask[distributed]
      - name: Run Dask stress tests
        run: |
          pytest -v -m "dask and slow"
