name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install black ruff
    - name: Check formatting with black
      run: |
        black --check .
    - name: Lint with ruff
      run: |
        ruff check .

  test:
    runs-on: ${{ matrix.os }}
    env:
      SAPTASE_SCRATCH_ROOT: ${{ runner.temp }}/saptase
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest numpy tqdm
        # We don't install Psi4 in CI, so tests will use mocks
    - name: Test with pytest (excluding slow)
      run: |
        pytest -v -m "not slow"

    - name: Run CLI Dask smoke test
      # Use mocks via CI_FAST=1, set OMP_NUM_THREADS just in case
      # Continue on Windows due to potential dask port flakes
      if: ${{ !cancelled() }} # Only run if previous steps succeeded
      continue-on-error: ${{ matrix.os == 'windows-latest' }}
      env:
        OMP_NUM_THREADS: 1
        CI_FAST: 1
      run: |
        python -m saptase.cli run examples/dask_local_demo.yml --mode dask

  # Optional job that tests with Psi4 (commented out for CI efficiency)
  # test-with-psi4:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v3
  #     with:
  #       fetch-depth: 0
  #   - name: Set up conda
  #     uses: conda-incubator/setup-miniconda@v2
  #     with:
  #       python-version: '3.10'
  #       channels: conda-forge,psi4
  #   - name: Install dependencies
  #     shell: bash -l {0}
  #     run: |
  #       conda install -c psi4 psi4
  #       pip install pytest numpy
  #   - name: Test with pytest
  #     shell: bash -l {0}
  #     run: |
  #       pytest -v

  stress:
    if: ${{ env.RUN_STRESS == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUN_STRESS: ${{ env.RUN_STRESS }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy tqdm dask[distributed]
      - name: Run Dask stress tests
        run: |
          pytest -v -m "dask and slow"
