# .github/workflows/build-thesis.yml
name: thesis-build

on:
  push:
    paths: [docs/thesis/**, .github/workflows/build-thesis.yml]
  pull_request:
    paths: [docs/thesis/**]

jobs:
  build:
    runs-on: ubuntu-latest          # 2-core runner
    timeout-minutes: 30

    steps:
    #------------------------------------------------------------
    # 0) Checkout repository
    #------------------------------------------------------------
    - name: Checkout repo
      uses: actions/checkout@v4

    #------------------------------------------------------------
    # 1) Mermaid ► SVG  (figures needed by LaTeX)
    #------------------------------------------------------------
    - name: Install mermaid-cli
      run: npm install -g @mermaid-js/mermaid-cli

    - name: Convert .mmd ▶︎ .svg
      run: |
        echo '{ "args": ["--no-sandbox"] }' > mmdc-puppeteer-config.json
        find docs/thesis/figs -name '*.mmd' -print0 |
          while IFS= read -r -d '' FILE; do
            out="${FILE%.*}.svg"
            echo "Converting $FILE → $out"
            mmdc -i "$FILE" -o "$out" --puppeteerConfigFile mmdc-puppeteer-config.json
          done
        rm mmdc-puppeteer-config.json

    #------------------------------------------------------------
    # 2) TeX-Live  (cache first, then install the packages we need)
    #------------------------------------------------------------
    - name: Cache TeX-Live installation         # restore first!
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/setup-texlive-action   # where the action installs TL
        key: texlive-2025-full                         # bump each year

    - name: Set-up TeX-Live (+latexmk & friends)
      uses: teatimeguest/setup-texlive-action@v3
      with:
        packages: |
          latexmk
          amsmath
          amsfonts
          lm                # Latin Modern fonts

    # → the action intentionally does **not** modify $PATH.
    - name: Add TeX-Live bin directory to PATH
      # `tlmgr` lives in …/bin/<arch>/ ; we prepend that to PATH for later steps.
      run: |
        TEXBIN="$(dirname "$(which tlmgr)")"
        echo "TEXBIN=$TEXBIN"
        echo "$TEXBIN" >> "$GITHUB_PATH"

    #------------------------------------------------------------
    # 3) Build PDF with latexmk
    #------------------------------------------------------------
    - name: Build thesis.pdf
      working-directory: docs/thesis
      run: |
        latexmk -pdf -interaction=nonstopmode -halt-on-error thesis.tex
        latexmk -c   # optional: clean aux files

    #------------------------------------------------------------
    # 4) Upload artefact
    #------------------------------------------------------------
    - name: Publish PDF artefact
      uses: actions/upload-artifact@v4
      with:
        name: thesis-pdf
        path: docs/thesis/thesis.pdf
