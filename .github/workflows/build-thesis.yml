# .github/workflows/build-thesis.yml
name: thesis-build

on:
  push:
    paths: [docs/thesis/**, .github/workflows/build-thesis.yml]
  pull_request:
    paths: [docs/thesis/**]

jobs:
  build:
    runs-on: ubuntu-latest          # free 2-core runner under GitHub Pro minutes
    timeout-minutes: 30

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    #------------------------------------------------------------
    # 1) Render any Mermaid *.mmd diagrams to SVG before LaTeX
    #------------------------------------------------------------
    - name: Install mermaid-cli
      run: npm install -g @mermaid-js/mermaid-cli

    - name: DEBUG - Show workflow file content on runner
      run: |
        echo "--- Workflow file content START ---"
        cat .github/workflows/build-thesis.yml
        echo "--- Workflow file content END ---"

    - name: Convert .mmd to .svg
      # Using a while loop instead of xargs to avoid potential interpretation issues.
      # Adding --no-sandbox for Puppeteer in CI environment.
      run: |
        echo '{ "args": ["--no-sandbox"] }' > mmdc-puppeteer-config.json
        find docs/thesis/figs -name '*.mmd' -print0 | while IFS= read -r -d $'\0' FILE; do
          outfile="${FILE%.*}.svg"
          echo "Converting [$FILE] to [$outfile]"
          mmdc -i "$FILE" -o "$outfile" --puppeteerConfigFile mmdc-puppeteer-config.json
        done
        rm mmdc-puppeteer-config.json # Clean up temp config file

    #------------------------------------------------------------
    # 2) Compile LaTeX with latexmk inside a full TeX Live image
    #    (fast, zero-config, includes LuaLaTeX/xelatex etc.)
    #------------------------------------------------------------
    - name: Set up TeX Live
      uses: teatimeguest/setup-texlive-action@v3   # ~400 MB but cached (see below)
      with:
        # Explicitly install latexmk and a few common packages
        packages: |
          latexmk
          amsmath
          amsfonts
          lm # Latin Modern fonts

    # Optional – cache TL install between runs (saves ~2 min)
    - name: Cache TeX Live
      uses: actions/cache@v4
      with:
        path: /usr/local/texlive
        key: texlive-2024-full            # bump yearly

    - name: Build PDF with latexmk
      working-directory: docs/thesis
      run: |
        latexmk -pdf -interaction=nonstopmode -halt-on-error thesis.tex
        latexmk -c                     # clean aux files (optional)

    #------------------------------------------------------------
    # 3) Upload the finished thesis.pdf
    #------------------------------------------------------------
    - name: Publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: thesis-pdf
        path: docs/thesis/thesis.pdf 